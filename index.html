<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>스마트 제어 시스템</title>
    <style>
        /* 기본 모바일 최적화 스타일링 */
        body {
            font-family: 'Malgun Gothic', sans-serif;
            background-color: #f0f2f5;
            margin: 0;
            padding: 20px;
            color: #333;
        }
        .container {
            max-width: 500px;
            margin: 0 auto;
        }
        h1 {
            text-align: center;
            font-size: 24px;
            color: #1a73e8;
        }
        /* 카드 형태의 컴포넌트 */
        .card {
            background: white;
            padding: 20px;
            border-radius: 15px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.1);
            margin-bottom: 20px;
        }
        .card h2 {
            margin-top: 0;
            font-size: 18px;
            border-bottom: 2px solid #f0f2f5;
            padding-bottom: 10px;
        }
        .status-display {
            font-size: 32px;
            font-weight: bold;
            text-align: center;
            margin: 20px 0;
        }
        /* 제어 버튼 스타일 */
        .btn {
            display: block;
            width: 100%;
            padding: 15px;
            border: none;
            border-radius: 10px;
            font-size: 18px;
            font-weight: bold;
            cursor: pointer;
            transition: background 0.3s;
        }
        .btn-on { background-color: #2ecc71; color: white; }
        .btn-off { background-color: #e74c3c; color: white; }
        
        /* 센서 그리드 */
        .grid {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 10px;
        }
        .sensor-box {
            background: #f8f9fa;
            padding: 15px;
            border-radius: 10px;
            text-align: center;
        }
        .sensor-value {
            font-size: 20px;
            font-weight: bold;
            color: #1a73e8;
        }
    </style>
</head>
<body>

    <div class="container">
        <h1>Smart Control IoT</h1>
        
        <div class="card">
            <h2>시스템 제어 스위치</h2>
            <div id="system-status" class="status-display" style="color: #e74c3c;">OFF</div>
            <button id="ctrl-btn" class="btn btn-on" onclick="toggleSystem()">시스템 가동</button>
        </div>

        <div class="card">
            <h2>실시간 센서 데이터</h2>
            <div class="grid">
                <div class="sensor-box">
                    <div>현재 온도</div>
                    <div id="temp-val" class="sensor-value">24.5 °C</div>
                </div>
                <div class="sensor-box">
                    <div>현재 습도</div>
                    <div id="humid-val" class="sensor-value">45 %</div>
                </div>
            </div>
        </div>
    </div>

    <script>
        let isSystemOn = false;

        // 버튼 클릭 시 상태를 전환하는 함수 (가상 통신 틀)
        function toggleSystem() {
            const statusDiv = document.getElementById('system-status');
            const btn = document.getElementById('ctrl-btn');

            isSystemOn = !isSystemOn;

            if (isSystemOn) {
                statusDiv.innerText = "ON";
                statusDiv.style.color = "#2ecc71";
                btn.innerText = "시스템 정지";
                btn.className = "btn btn-off";
                
                // 추후 하드웨어 연동 시 여기에 통신 코드 삽입 예시:
                // sendCommandToHardware("ON");
                console.log("서버로 전송할 데이터: { status: 'ON' }");
            } else {
                statusDiv.innerText = "OFF";
                statusDiv.style.color = "#e74c3c";
                btn.innerText = "시스템 가동";
                btn.className = "btn btn-on";
                
                console.log("서버로 전송할 데이터: { status: 'OFF' }");
            }
        }

        // 센서 값이 실시간으로 변하는 것처럼 보여주는 시뮬레이터 함수
        setInterval(() => {
            if(isSystemOn) {
                // 시스템이 켜져 있을 때 값이 미세하게 변하도록 설정
                const randomTemp = (24 + Math.random() * 2).toFixed(1);
                const randomHumid = Math.floor(40 + Math.random() * 10);
                
                document.getElementById('temp-val').innerText = randomTemp + " °C";
                document.getElementById('humid-val').innerText = randomHumid + " %";
            }
        }, 2000); // 2초마다 갱신
    </script>
</body>
</html>
